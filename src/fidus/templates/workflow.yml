# Fidus nightly documentation sync. Place in your DOCS repository at .github/workflows/fidus.yml
# Setup guide: https://github.com/mustafarslan/fidus#setup
name: Fidus nightly docs sync

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC. GitHub may start scheduled runs late; Fidus is cursor-based, so nothing is lost.
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | sync | audit | full"
        type: choice
        options: [auto, sync, audit, full]
        default: auto
      dry-run:
        description: "Run without pushing (artifacts uploaded instead)"
        type: boolean
        default: false

concurrency:
  group: fidus-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read # all writes use the GitHub App token below, not GITHUB_TOKEN

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FIDUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.FIDUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # token covers every repo the App is installed on

      - name: Look up the App's bot user (for commit attribution)
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false # Fidus passes the token to git itself

      - name: Fidus
        uses: mustafarslan/fidus@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          mode: ${{ inputs.mode || 'auto' }}
          dry-run: ${{ inputs.dry-run || 'false' }}
          git-user-name: ${{ steps.app-token.outputs.app-slug }}[bot]
          git-user-email: ${{ steps.bot.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com

      - name: Upload dry-run artifacts
        if: ${{ inputs.dry-run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: fidus-dry-run
          path: fidus-out
