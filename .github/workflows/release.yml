# Tag vX.Y.Z to release: build -> TestPyPI -> PyPI (trusted publishing) -> GitHub release + move vX.
# Versions already on an index are skipped, so re-running or tagging a manual upload is safe.
# One-time setup: add a trusted publisher on pypi.org and test.pypi.org for
#   owner mustafarslan, repo fidus, workflow release.yml, environment pypi / testpypi.
name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist }

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - id: exists
        env: { VERSION: "${{ needs.build.outputs.version }}" }
        run: echo "found=$(curl -s -o /dev/null -w '%{http_code}' "https://test.pypi.org/pypi/fidus/${VERSION}/json")" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found != '200'
        uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - if: steps.exists.outputs.found != '200'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - id: exists
        env: { VERSION: "${{ needs.build.outputs.version }}" }
        run: echo "found=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/fidus/${VERSION}/json")" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found != '200'
        uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - if: steps.exists.outputs.found != '200'
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Move the major tag (e.g. v1) to this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          # Workflows generated by `fidus init` pin @v1, so 0.x releases publish there too.
          if [ "$major" = "v0" ]; then major="v1"; fi
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "$major"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
