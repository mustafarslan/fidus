[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fidus"
version = "0.1.0"
description = "Autonomous documentation agent: keeps a textbook-style docs repo in sync with your codebases via nightly pull requests."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mustafa Arslan" }]
keywords = ["documentation", "llm", "agent", "github-app", "github-action", "docs-as-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "httpx>=0.27",
  "pathspec>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.50"]
all = ["anthropic>=0.40", "google-genai>=1.0", "openai>=1.50"]

[project.scripts]
fidus = "fidus.cli.app:main"

[project.urls]
Homepage = "https://github.com/mustafarslan/fidus"
Issues = "https://github.com/mustafarslan/fidus/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fidus"]

[tool.hatch.build.targets.sdist]
include = ["src/fidus", "README.md", "LICENSE", "action.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/fidus"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "google.*", "openai.*", "pathspec.*", "ruamel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits real LLM/GitHub APIs (set FIDUS_LIVE=1)"]
